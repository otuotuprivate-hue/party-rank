<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Party Rank点数評価ツール</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <h1>Party Rank点数評価ツール</h1>
  <p class="lead" id="lead"></p>

  <div class="panel bar" id="userBar">
    <span id="meName"></span><span class="badge" id="adminBadge" hidden>管理者</span>
    <span class="grow"></span>
    <button id="rename" hidden>名前を変更</button><button id="leave" hidden>名前を切り替える</button>
    <button id="adminIn">管理者画面に入る</button><button id="adminOut" hidden>管理者画面を出る</button>
  </div>

  <div class="panel" id="joinPanel" hidden>
    <form id="jf" class="inl">
      <label>名前<input id="jn" maxlength="30" required autocomplete="nickname"></label>
      <label>合言葉(任意・4文字以上)<input id="jp" type="password" maxlength="60" autocomplete="off"></label>
      <button class="pri">参加して採点する</button>
    </form>
    <p class="hint" style="margin:8px 0 0">合言葉を決めておくと、別の端末から同じ名前で続きを採点できます。登録なしでも使えますが、ブラウザのデータを消すと同じ名前に戻れなくなります。</p>
    <div class="m" id="jmsg" role="alert"></div>
  </div>

  <div class="panel" id="renamePanel" hidden>
    <form id="rf" class="inl">
      <label>新しい名前<input id="rn" maxlength="30" required></label>
      <button class="pri">変更する</button><button type="button" id="rcancel">キャンセル</button>
    </form>
    <div class="m" id="rmsg" role="alert" style="margin-top:6px"></div>
  </div>

  <div class="panel" id="loginPanel" hidden>
    <form id="lf" class="inl">
      <label>管理者名<input id="adm" maxlength="30" required autocomplete="username"></label>
      <label>パスワード<input id="pw" type="password" required autocomplete="current-password"></label>
      <button class="pri">入る</button><button type="button" id="lcancel">キャンセル</button>
    </form>
    <div class="m" id="lmsg" role="alert" style="margin-top:6px"></div>
  </div>

  <div class="panel" id="adminMgr" hidden>
    <form id="af" class="inl">
      <label>新しい管理者名<input id="an" maxlength="30" required></label>
      <label>パスワード(必須・6文字以上)<input id="ap" type="password" autocomplete="new-password" required></label>
      <button class="pri">管理者を追加</button>
    </form>
    <div class="m" id="admList" style="margin-top:6px"></div>
    <h2 style="margin:16px 0 8px;font-size:16px">参加者</h2>
    <div class="ppl" id="ppl"></div>
  </div>

  <div class="bar" id="ctl">
    <select id="year" aria-label="年"></select>
    <select id="cour" aria-label="クール">
      <option value="1">冬(1月〜)</option><option value="4">春(4月〜)</option>
      <option value="7">夏(7月〜)</option><option value="10">秋(10月〜)</option>
    </select>
    <select id="kind" aria-label="種別"><option>OP</option><option>ED</option><option>挿入歌</option><option>キャラソン</option></select>
    <span class="grow"></span>
    <button id="exMine">自分のランキングをCSV出力</button>
  </div>
  <div class="tabs" id="tabs" aria-label="曲のある区分"></div>

  <div class="panel" id="addPanel" hidden>
    <form id="f">
      <label>曲名<input id="title" required maxlength="80"></label>
      <label>アーティスト<input id="artist" maxlength="60"></label>
      <label>アニメ作品名<input id="anime" maxlength="80"></label>
      <button class="pri" id="fsub">曲を追加</button>
    </form>
    <div class="bar" id="fcancelBar" hidden style="margin:8px 0 0"><span class="m" id="editNote"></span><button type="button" id="fcancel">編集をやめる</button></div>
    <form id="pf" class="inl" style="margin-top:14px">
      <label style="flex:1;min-width:240px">この区分のiTunes(Apple Music)プレイリストのURL<input id="purl" type="url" maxlength="500" placeholder="https://music.apple.com/jp/playlist/…"></label>
      <button class="pri">プレイリストを保存</button>
    </form>
    <p class="hint" style="margin:6px 0 0">貼れるのは管理者だけです。空にして保存すると、リンクを外せます。リンクは参加者にも表示されます。</p>
  </div>

  <div id="adminSec" hidden>
    <div class="bar" style="margin-top:22px"><h2 id="mh" style="margin:0"></h2><span class="grow"></span></div>
    <div class="bar">
      <button id="exTbl">全体表CSV(集計行つき)</button>
      <button id="exVcsv" class="sec">動画用CSV</button>
      <button id="exVjson" class="sec">動画用JSON</button>
      <label class="m"><input type="checkbox" id="desc"> 順位の低い順に並べる(順位発表用)</label>
    </div>
    <div id="matrix"></div>
    <details class="panel" id="cmBox" hidden style="margin-top:12px"><summary id="cmSum"></summary><div id="cmList" style="margin-top:8px"></div></details>
  </div>

  <h2 id="rh"></h2>
  <div id="rank"></div>
  <h2 id="lh"></h2>
  <p class="plink" id="plink"></p>
  <div id="list"></div>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="/app.js"></script>
</body>
</html>
