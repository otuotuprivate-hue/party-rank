<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Party Rank" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a3fe0"/><stop offset=".55" stop-color="#8a2fc9"/><stop offset="1" stop-color="#e0306f"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#f5a800"/></linearGradient>
    <linearGradient id="pod" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e4def8"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".38" r=".6"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <path id="star" d="M0-1 .294-.405 .951-.309 .476.155 .588.809 0 .5-.588.809-.476.155-.951-.309-.294-.405z"/>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- 放射状のライブ光線 -->
  <g stroke="#fff" stroke-opacity=".13" stroke-width="22" stroke-linecap="round">
    <path d="M256 190 256 40"/><path d="M256 190 130 70"/><path d="M256 190 382 70"/><path d="M256 190 70 130"/><path d="M256 190 442 130"/>
  </g>
  <!-- 表彰台 -->
  <g>
    <rect x="62" y="318" width="116" height="110" rx="14" fill="url(#pod)" opacity=".92"/>
    <rect x="334" y="352" width="116" height="76" rx="14" fill="url(#pod)" opacity=".92"/>
    <rect x="160" y="268" width="192" height="160" rx="16" fill="url(#pod)"/>
    <rect x="48" y="420" width="416" height="26" rx="13" fill="#1c1b3a" opacity=".38"/>
  </g>
  <!-- 2位・3位の☆ -->
  <use href="#star" transform="translate(120 290) scale(30)" fill="#ffd9e6"/>
  <use href="#star" transform="translate(392 324) scale(26)" fill="#ffd9e6"/>
  <!-- 1位の音符 -->
  <g fill="url(#gold)">
    <ellipse cx="226" cy="236" rx="44" ry="32" transform="rotate(-22 226 236)"/>
    <rect x="252" y="96" width="22" height="132" rx="8"/>
    <path d="M262 96C290 104 344 118 344 166 344 192 326 206 312 214 324 188 304 168 262 160Z"/>
  </g>
  <!-- きらめき -->
  <use href="#star" transform="translate(372 108) scale(30)" fill="#fff"/>
  <use href="#star" transform="translate(148 126) scale(18)" fill="#fff" opacity=".85"/>
  <use href="#star" transform="translate(420 214) scale(14)" fill="#ffe27a"/>
  <!-- 1位の数字「1」 -->
  <path d="M236 316 266 296 276 296 276 392 252 392 252 322 240 330Z" fill="#4a3fe0"/>
  <rect x="226" y="392" width="76" height="14" rx="7" fill="#4a3fe0" opacity="0"/>
</svg>
